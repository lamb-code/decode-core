<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    // 原生的
    // import {
    //   reactive,
    //   effect,
    // } from "/node_modules/vue/dist/vue.esm-browser.js";

    // 自己的
    import { reactive, effect } from "../dist/reactivity.js";

    const obj = { name: "jane", age: 30, flag: true };
    const state = reactive(obj);

    const runner = effect(() => {
      console.log("runner....");
      app.innerHTML = state.flag ? state.name : state.age;
    }, {
      scheduler: () => {
        console.log('数据更新了，不重新渲染，走自己的逻辑')
        //自己控制渲染
        runner()
      }
    });
    setTimeout(() => {
      state.flag = false;
    }, 1000);
  </script>
</body>

</html>
