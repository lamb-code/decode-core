<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    // 原生的
    // import {
    //   reactive,
    //   effect,
    //   ref,
    //   toRef,
    //   toRefs,
    //   proxyRefs,
    //   computed,
    //   watch,
    // } from "/node_modules/vue/dist/vue.esm-browser.js";

    // console.log(watch);
    // 自己的
    import {
      reactive,
      effect,
      computed
    } from "../dist/reactivity.js";
    // 计算属性 具有缓存作用，比如下面多次访问只会执行一次 只打印了一次 runner
    const state = reactive({ name: "jw" });
    const aliasName = computed(() => {
      console.log("runner");
      return "***" + state.name
    });
    // computed第二种写法
    // const aliasName =computed({
    //   get(oldValue){
    //     return "***" + state.name
    //   },
    //   set(v){
    //     console.log(v)
    //     return v
    //   }
    // })
    effect(() => {
      console.log(aliasName.value)
      console.log(aliasName.value)
      console.log(aliasName.value)
    })

    setTimeout(() => {
      state.name = 'gggg'
    }, 1000)
    //计算属性原理
    //计算属性维护了一个dirty属性，默认是true 运行过一次变为false 并且依赖的变化之后再次让dirty变为true
    //1. 计算属性具备收集能力 可以收集对应的effect 依赖的值变化会触发effect重新执行
    //计算属性也是一个effect 依赖的属性会收集这个计算属性 当前值变化后会让computedEffect里面的dirty变为true

    // 计算属性aliasName, 计算属性依赖的值name
    // 计算属性本身就是一个effect, 有一个标识dirty = true, 访问的时候会, 触发name属性的get方法(依赖收集)
    // 将name属性和计算属性做一个映射, 稍后name变化后会触发计算属性的scheduler
    // 计算属性可能在effect中使用, 当取计算属性的时候, 会对当前的effect进行依赖收集
    // 如果name属性变化了, 会通知计算属性将dirty 变为true(触发计算属性收集的effect)

    // name  --> 计算属性dirty=true --> 计算属性的scheduler -->触发计算属性收集的effect
  </script>
</body>

</html>
