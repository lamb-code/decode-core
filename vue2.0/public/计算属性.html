<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <div style="color: red">{{fullName}}{{fullName}} {{fullName}}</div>
    </div>
    <script src="../dist/umd/vue.js"></script>
    <!-- <script src="https://cdn.bootcdn.net/ajax/libs/vue/2.7.14/vue.js"></script> -->

    <script>
      const vm = new Vue({
        data: {
          firstName: "Jane",
          lastName: "Tau",
        },
        computed: {
          // fullName(){
          //   return this.firstName+this.lastName
          // }
          fullName: {
            get() {
              console.log("running...");
              return this.firstName + this.lastName;
            },
            set() {},
          },
        },
        el: "#app", //我们需要将数据解析到el元素上
      });
      setTimeout(() => {
        vm.firstName = "Liu";
      }, 1000);
      /*
       *计算属性的用法，作用？
       *用法有两种写法 一种是函数，另一种是对象包含get set 方法 由此可见 计算属性是definePorperty模式
       *计算属性 依赖的值发生变化才会重新执行用户的方法不会立刻执行
       *计算属性需要维护一个dirty属性 有缓存作用 多次取值不会多次执行
       *计算属性也是一个watcher称计算属性watcher,默认渲染会创建一个渲染watcher
       *总结:计算属性不会去收集依赖属性，只会让依赖属性收集渲染watcher
       */
    </script>
  </body>
</html>
