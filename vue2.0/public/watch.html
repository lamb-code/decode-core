<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <div style="color: red">{{fullName}}{{fullName}} {{fullName}}</div>
    </div>
    <!-- <script src="../dist/umd/vue.js"></script> -->
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/2.7.14/vue.js"></script>

    <script>
      const vm = new Vue({
        data: {
          firstName: "Jane",
          lastName: "Tau",
        },
        watch: {
          firstName(newValue,oldValue){
            console.log(newValue,oldValue)
          } 
        },
        el: "#app", //我们需要将数据解析到el元素上
      });
      setTimeout(() => {
        vm.firstName = "Liu";
      }, 1000);
      /*
       *watch的用法，作用？
       *用法有好几种种写法 一种直接是函数，另一种是数组里包含函数 还有$watch ,
       *底层是不管你写的函数还是数组 都会被转化$watch
       *
       */
    </script>
  </body>
</html>
